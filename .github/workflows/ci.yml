name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests with coverage & race detector
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build binary
        run: go build -v -o bin/testguard ./cmd/testguard

      - name: Smoke test compiled CLI
        shell: bash
        run: |
          ./bin/testguard --version
          ./bin/testguard rules
          ./bin/testguard explain GUARD-DART-SEED-ECHO
          ./bin/testguard explain GUARD-DART-UNCOVERED-MUTATION
