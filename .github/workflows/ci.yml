name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run unit and race tests
        run: go test -v -race ./...

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=1 go build -v -o bin/ ./cmd/testguard

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign -s - ./bin/testguard

      - name: Smoke test compiled CLI
        shell: bash
        run: |
          BIN="./bin/testguard"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="./bin/testguard.exe"
          fi
          "$BIN" --version
          "$BIN" rules
          "$BIN" explain GUARD-DART-SEED-ECHO
          "$BIN" explain GUARD-DART-UNCOVERED-MUTATION
